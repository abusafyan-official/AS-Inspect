[package]
name = "as-inspect-cli"
version = "0.1.0"
edition = "2021"
authors = ["Abu Safyan"]
license = "MIT"

[[bin]]
name = "as-inspect"
path = "src/main.rs"

[dependencies]
as-inspect-core = { path = "../as-inspect-core" }
as-inspect-analyzers = { path = "../as-inspect-analyzers" }
as-inspect-reports = { path = "../as-inspect-reports" }
as-inspect-evidence = { path = "../as-inspect-evidence" }
clap = { version = "4.5", features = ["derive"] }
serde_json = "1.0"
