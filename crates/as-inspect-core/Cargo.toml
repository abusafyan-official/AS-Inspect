[package]
name = "as-inspect-core"
version = "0.1.0"
edition = "2021"
authors = ["Abu Safyan"]
description = "Core types, models, error definitions, and traits for AS Inspect"
license = "MIT"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.8", features = ["v4", "serde"] }
