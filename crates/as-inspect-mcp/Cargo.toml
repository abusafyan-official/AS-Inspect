[package]
name = "as-inspect-mcp"
version = "0.1.0"
edition = "2021"
authors = ["Abu Safyan"]
license = "MIT"

[[bin]]
name = "as-inspect-mcp"
path = "src/main.rs"

[dependencies]
as-inspect-core = { path = "../as-inspect-core" }
as-inspect-analyzers = { path = "../as-inspect-analyzers" }
as-inspect-reports = { path = "../as-inspect-reports" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["full"] }
