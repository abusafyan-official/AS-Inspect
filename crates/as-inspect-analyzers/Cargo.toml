[package]
name = "as-inspect-analyzers"
version = "0.1.0"
edition = "2021"
authors = ["Abu Safyan"]
license = "MIT"

[dependencies]
as-inspect-core = { path = "../as-inspect-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.10"
sha2 = "0.10"
md-5 = "0.10"
hex = "0.4"
regex = "1.10"
goblin = "0.8"
memmap2 = "0.9"
walkdir = "2.5"
chrono = { version = "0.4", features = ["serde"] }
rayon = "1.10"
