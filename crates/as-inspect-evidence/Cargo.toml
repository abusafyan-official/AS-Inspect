[package]
name = "as-inspect-evidence"
version = "0.1.0"
edition = "2021"
authors = ["Abu Safyan"]
license = "MIT"

[dependencies]
as-inspect-core = { path = "../as-inspect-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.31", features = ["bundled"] }
thiserror = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.8", features = ["v4"] }
