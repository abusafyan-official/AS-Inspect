[workspace]
resolver = "2"
members = [
    "crates/as-inspect-core",
    "crates/as-inspect-analyzers",
    "crates/as-inspect-evidence",
    "crates/as-inspect-reports",
    "crates/as-inspect-ai",
    "crates/as-inspect-mcp",
    "crates/as-inspect-cli",
    "apps/desktop/src-tauri",
]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
