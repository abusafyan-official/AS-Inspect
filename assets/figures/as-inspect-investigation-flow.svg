<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 700; font-size: 26px; fill: #0f172a; }
      .box-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 700; font-size: 19px; fill: #0f172a; }
      .box-brand { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 26px; fill: #1e3a8a; }
      .box-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 13px; fill: #64748b; }
      .box-sub-dark { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 13px; fill: #334155; }
      .loop-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 13px; fill: #1e40af; }
      .card { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.8; rx: 10px; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.04)); }
      .card-active { fill: #ffffff; stroke: #2563eb; stroke-width: 2.2; rx: 10px; filter: drop-shadow(0 4px 6px rgba(37,99,235,0.08)); }
      .arrow { stroke: #64748b; stroke-width: 1.8; fill: none; }
      .arrow-blue { stroke: #2563eb; stroke-width: 2; fill: none; }
      .marker-head { fill: #64748b; }
      .marker-head-blue { fill: #2563eb; }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" class="marker-head" />
    </marker>
    <marker id="arrowhead-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" class="marker-head-blue" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="40" y="45" class="title">AS Inspect investigation flow</text>

  <!-- Follow-up question loop -->
  <path d="M 780 120 L 780 75 L 365 75 L 365 116" class="arrow-blue" marker-end="url(#arrowhead-blue)" />
  <text x="572" y="65" text-anchor="middle" class="loop-label">Follow-up question</text>

  <!-- 1. Ask Box -->
  <g transform="translate(40, 120)">
    <rect width="190" height="135" class="card" />
    <text x="95" y="40" text-anchor="middle" class="box-title">1. Ask</text>
    <text x="95" y="78" text-anchor="middle" class="box-sub-dark">Your agent + local target</text>
    <text x="95" y="105" text-anchor="middle" class="box-sub">App / binary / folder</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <line x1="230" y1="187" x2="266" y2="187" class="arrow" marker-end="url(#arrowhead)" />

  <!-- 2. Inspect & trace (AS Inspect Box) -->
  <g transform="translate(270, 120)">
    <rect width="190" height="135" class="card-active" />
    <text x="95" y="38" text-anchor="middle" class="box-title">2. Inspect &amp; trace</text>
    <text x="95" y="80" text-anchor="middle" class="box-brand">AS Inspect</text>
    <text x="95" y="110" text-anchor="middle" class="box-sub-dark">CLI / MCP</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <line x1="460" y1="187" x2="496" y2="187" class="arrow" marker-end="url(#arrowhead)" />

  <!-- 3. Read the evidence -->
  <g transform="translate(500, 120)">
    <rect width="190" height="135" class="card" />
    <text x="95" y="38" text-anchor="middle" class="box-title">3. Read the evidence</text>
    <text x="95" y="80" text-anchor="middle" class="box-sub-dark">EV-0001 / PE / ASAR</text>
    <text x="95" y="105" text-anchor="middle" class="box-sub">Capabilities / URLs</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <line x1="690" y1="187" x2="726" y2="187" class="arrow" marker-end="url(#arrowhead)" />

  <!-- 4. Use what you learn -->
  <g transform="translate(730, 120)">
    <rect width="190" height="135" class="card" />
    <text x="95" y="35" text-anchor="middle" class="box-sub-dark">4. Use what you learn</text>
    <text x="95" y="75" text-anchor="middle" class="box-title" style="font-size: 21px;">Your agent</text>
    <text x="95" y="110" text-anchor="middle" class="box-sub">Explain / implement / audit</text>
  </g>

  <!-- Bottom Arrow: Analysis Tools -> AS Inspect -->
  <line x1="365" y1="305" x2="365" y2="259" class="arrow" marker-end="url(#arrowhead)" />

  <!-- Analysis tools (bottom card) -->
  <g transform="translate(270, 310)">
    <rect width="190" height="110" class="card" />
    <text x="95" y="42" text-anchor="middle" class="box-title">Analysis tools</text>
    <text x="95" y="75" text-anchor="middle" class="box-sub-dark">PE, ASAR, Hashes</text>
    <text x="95" y="93" text-anchor="middle" class="box-sub">Authenticode, Strings</text>
  </g>
</svg>
